spring:
  application:
    name: backend

  profiles:
    active: local

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    cloudfront:
      domain: ${CLOUDFRONT_DOMAIN}

app:
  s3:
    bucket: ${S3_BUCKET}
  jwt:
    secret: ${JWT_SECRET:local-jwt-secret-for-development}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 14
  oauth:
    kakao:
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      user-info-uri: https://openapi.naver.com/v1/nid/me
    social-signup-token-expiration-minutes: 10
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  password-reset:
    code-expiration-minutes: 5
    token-expiration-minutes: 10

  nts:
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    service-key: ${NTS_SERVICE_KEY:}

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
