spring:
  application:
    name: backend

  profiles:
    active: local

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    cloudfront:
      domain: ${CLOUDFRONT_DOMAIN}

app:
  s3:
    bucket: ${S3_BUCKET}
  jwt:
    secret: ${JWT_SECRET:local-jwt-secret-for-development}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 14
  oauth:
    kakao:
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      user-info-uri: https://openapi.naver.com/v1/nid/me
    social-signup-token-expiration-minutes: 10
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  email-verification:
    code-expiration-minutes: ${EMAIL_VERIFICATION_CODE_EXPIRATION_MINUTES:5}
    token-expiration-minutes: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION_MINUTES:10}
  password-reset:
    code-expiration-minutes: 5
    token-expiration-minutes: 10

  nts:
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    service-key: ${NTS_SERVICE_KEY:}

  # 실제 실패는 최초 포함 최대 2회 / RETRY_WAIT는 지정 시각 이후, PROCESSING은 60분 후 복구
  place-overview:
    pending:
      enabled: ${PLACE_OVERVIEW_PENDING_ENABLED:true}
      fixed-delay-ms: ${PLACE_OVERVIEW_PENDING_FIXED_DELAY_MS:60000}
    retry:
      enabled: ${PLACE_OVERVIEW_RETRY_ENABLED:true}
      fixed-delay-ms: ${PLACE_OVERVIEW_RETRY_FIXED_DELAY_MS:60000}
    external-api:
      # 일일 한도 소진 후 대기
      daily-quota-cooldown-seconds: ${PLACE_OVERVIEW_DAILY_QUOTA_COOLDOWN_SECONDS:86400}
      rate-limit-cooldown-seconds: ${PLACE_OVERVIEW_RATE_LIMIT_COOLDOWN_SECONDS:60}
      transient-cooldown-seconds: ${PLACE_OVERVIEW_TRANSIENT_COOLDOWN_SECONDS:30}

  # 장소 설명 근거 수집용 Daum 검색 설정
  daum:
    api-key: ${KAKAO_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    timeout-seconds: 15
    search-size: 5

  course-search:
    enabled: ${COURSE_SEARCH_ENABLED:false}
    timeout-seconds: ${COURSE_SEARCH_TIMEOUT_SECONDS:45}
    embedding:
      enabled: ${COURSE_SEARCH_EMBEDDING_ENABLED:false}
      model: ${COURSE_SEARCH_EMBEDDING_MODEL:gemini-embedding-001}
      dimensions: ${COURSE_SEARCH_EMBEDDING_DIMENSIONS:768}
      timeout-seconds: ${COURSE_SEARCH_EMBEDDING_TIMEOUT_SECONDS:10}
      minimum-similarity: ${COURSE_SEARCH_EMBEDDING_MINIMUM_SIMILARITY:0.675}
      session-ttl-seconds: ${COURSE_SEARCH_EMBEDDING_SESSION_TTL_SECONDS:900}
      index-batch-size: ${COURSE_SEARCH_EMBEDDING_INDEX_BATCH_SIZE:20}
      index-scan-size: ${COURSE_SEARCH_EMBEDDING_INDEX_SCAN_SIZE:100}
      fixed-delay-ms: ${COURSE_SEARCH_EMBEDDING_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${COURSE_SEARCH_EMBEDDING_INITIAL_DELAY_MS:1000}

  # 검색 근거 기반 장소 설명 생성용 Gemini 설정
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    timeout-seconds: 60

  tour-api:
    base-url: https://apis.data.go.kr/B551011/KorService2
    service-key: ${TOUR_API_SERVICE_KEY:}
    mobile-os: ETC
    mobile-app: Yeogido
    sync-enabled: ${TOUR_API_SYNC_ENABLED:true}
    sync-cron: ${TOUR_API_SYNC_CRON:0 0 4 * * *}
    sync-months: ${TOUR_API_SYNC_MONTHS:12}
    sync-page-size: ${TOUR_API_SYNC_PAGE_SIZE:100}
    sync-max-pages: ${TOUR_API_SYNC_MAX_PAGES:50}
    sync-max-detail-calls: ${TOUR_API_SYNC_MAX_DETAIL_CALLS:800}

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
