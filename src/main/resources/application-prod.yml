spring:
  config:
    activate:
      on-profile: prod

  main:
    banner-mode: "off"

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        environment: prod
  level:
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off

management:
  health:
    db:
      enabled: true
    redis:
      enabled: true
