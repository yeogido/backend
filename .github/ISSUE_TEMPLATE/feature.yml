name: "Feature (기능 추가)"
description: 새로운 기능을 추가할 때 사용하는 템플릿입니다.
title: "[FEAT] "
labels:
  - "feature"

body:
  - type: textarea
    id: feature
    attributes:
      label: "📌 기능 설명"
      description: "추가할 기능에 대해 간략히 설명해주세요."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "📝 세부 작업 내용"
      description: "이 이슈를 해결하기 위해 해야 할 구체적인 작업들을 체크리스트로 작성해주세요."
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "🔗 참고자료 (선택)"
      description: "기획서 문서, 와이어프레임 화면, API 명세서 등 참고할 링크가 있다면 남겨주세요."
    validations:
      required: false