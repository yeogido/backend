name: "Refactor (리팩토링)"
description: 코드를 개선하거나 구조를 변경할 때 사용하는 템플릿입니다.
title: "[REFACTOR] "
labels:
  - "refactor"

body:
  - type: textarea
    id: purpose
    attributes:
      label: "📌 리팩토링 목적"
      description: "왜 코드를 개선해야 하는지 이유를 설명해주세요."
    validations:
      required: true

  - type: textarea
    id: contents
    attributes:
      label: "📝 리팩토링 내용"
      description: "어떤 부분을 어떻게 변경할 것인지 구체적으로 적어주세요."
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: effect
    attributes:
      label: "💡 기대 효과"
      description: "이 리팩토링을 통해 얻을 수 있는 장점(예: 성능 향상, 가독성 개선)을 적어주세요."
    validations:
      required: false