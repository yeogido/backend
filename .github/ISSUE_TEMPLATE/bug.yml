name: "Bug (버그 수정)"
description: 서비스 중 발생한 버그를 제보하고 수정할 때 사용하는 템플릿입니다.
title: "[BUG] "
labels:
  - "bug"

body:
  - type: textarea
    id: bug-description
    attributes:
      label: "📌 버그 설명"
      description: "어떤 버그인지 간략하게 설명해주세요."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "💻 발생 경로 (재현 방법)"
      description: "버그가 어떻게 발생했는지 순서대로 적어주세요."
      value: |
        1.
        2.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "🎯 기대하는 정상 동작"
      description: "원래는 어떻게 작동해야 하는지 설명해주세요."
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: "🚨 에러 로그 (선택)"
      description: "포스트맨 에러 코드나 인텔리제이(Spring Boot) 콘솔에 찍힌 에러 로그를 첨부해주세요."
    validations:
      required: false